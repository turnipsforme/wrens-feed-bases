name: Verify feed
on:
  pull_request:
  push:
    branches: [main, "aae/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node --test tests/*.test.mjs
      - name: Record mocked baseline
        run: node --expose-gc scripts/benchmark.mjs > benchmark.json
      - name: Measure original revision on the same runner
        run: |
          trap 'git restore --source=HEAD -- src' EXIT
          git restore --source=a45502b1844608711cf29c1494ec6ffbce610dcb -- src
          bun run build
          node --expose-gc scripts/benchmark.mjs > original-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: mocked-benchmark
          path: |
            benchmark.json
            original-benchmark.json
